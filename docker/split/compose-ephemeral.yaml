name: ach-agent-split-ephemeral

services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: harness
    command: ["--role", "harness"]
    environment:
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
    ports: ["8080:8080"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /tmp/ach-harness-state:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; c=httpx.Client(transport=httpx.HTTPTransport(uds='/run/ach-agent/channels/channel.sock'), base_url='http://ach-internal', timeout=2); c.get('/healthz').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s
    volumes:
      - ./${ACH_HARNESS_CONFIG_FILE:-config-ephemeral.yaml}:/etc/ach-agent/config.yaml:ro
      - ephemeral-workspace:/tmp/ach-home/workspace
      - ephemeral-public-context:/tmp/ach-public-context
      - ephemeral-channels-ipc:/run/ach-agent/channels
      - ephemeral-engine-ipc:/run/ach-agent/engine:ro

  channels:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: channels
    command: ["--role", "channels"]
    depends_on: [harness]
    network_mode: service:harness
    environment:
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777"]
    volumes:
      - ephemeral-channels-ipc:/run/ach-agent/channels:ro

  engine:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: ${ACH_ENGINE_TARGET:-engine-opencode}
    command: ["--role", "engine"]
    network_mode: service:harness
    environment:
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /tmp/ach-home:uid=10001,gid=10001
      - /tmp/ach-home/state:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; c=httpx.Client(transport=httpx.HTTPTransport(uds='/run/ach-agent/engine/agent.sock'), base_url='http://ach-internal', timeout=2); c.get('/healthz').raise_for_status()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s
    volumes:
      - ephemeral-engine-ipc:/run/ach-agent/engine
      - ephemeral-workspace:/tmp/ach-home/workspace
      - ephemeral-public-context:/tmp/ach-public-context:ro

volumes:
  ephemeral-workspace:
  ephemeral-public-context:
  ephemeral-channels-ipc:
  ephemeral-engine-ipc:
