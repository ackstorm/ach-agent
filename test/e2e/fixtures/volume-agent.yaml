# Workspace and session persistence on a PVC per Workspace (type volume), no S3: the session
# closes 15 s after its turn, the Workspace 20 s after that, and the next event mounts the same
# PVC in a new sandbox. Every Workspace start appends a line to .e2e-starts.
apiVersion: ach-agent.ackstorm.ai/v1alpha1
kind: Agent
metadata: {name: "${NAME}", namespace: ach-agent-e2e}
spec:
  profileRef: {name: e2e}
  capabilityServer: standalone
  standalone:
    model:
      name: e2e-model
      api: openai
      baseUrl: http://e2e-stub.ach-agent-e2e.svc.cluster.local:8090/v1
      headers:
        x-litellm-api-key: {secretKeyRef: {name: e2e-model, key: apiKey}}
  workspace:
    idleTimeoutSeconds: 20
    persistence:
      type: volume
      retentionDays: 1
      volume: {size: 1Gi}
    session:
      idleTimeoutSeconds: 15
  hooks:
    workspaceStart: {script: "echo start >> .e2e-starts"}
  channels:
    - name: hook
      type: webhook
      source: generic
      routing: {sessionKey: "e2e"}
      prompt: "Reply briefly. {{ payload | json }}"
      webhook:
        auth: {type: header_token, header: X-E2E-Token, secretRef: {name: e2e-hook, key: token}}
  expose: {service: true}
