name: ach-agent-split-ephemeral

services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: default
    command: ["--role", "harness"]
    environment:
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      DEBUG: ${DEBUG:-}
      CUSTOM_TOOL_TOKEN: ${CUSTOM_TOOL_TOKEN:-}
      SPLIT_PREPARE_TOKEN: ${SPLIT_PREPARE_TOKEN:-}
    ports: ["8080:8080"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /tmp/ach-agent/state:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-m", "ach_agent.healthcheck", "--role", "harness", "--check", "startup"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - ./${ACH_HARNESS_CONFIG_FILE:-config-ephemeral.yaml}:/etc/ach-agent/config.yaml:ro
      - ephemeral-workspace:/tmp/ach-agent/workspace
      - ephemeral-channels-ipc:/run/ach-agent/channels
      - ephemeral-engine-ipc:/run/ach-agent/engine:ro
      - ephemeral-transfer-ipc:/run/ach-agent/transfer

  channels:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: default
    command: ["--role", "channels"]
    depends_on: [harness]
    network_mode: service:harness
    environment:
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      DEBUG: ${DEBUG:-}
      CUSTOM_TOOL_TOKEN: ${CUSTOM_TOOL_TOKEN:-}
      SPLIT_PREPARE_TOKEN: ${SPLIT_PREPARE_TOKEN:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777"]
    healthcheck:
      test: ["CMD", "python", "-m", "ach_agent.healthcheck", "--role", "channels", "--check", "readiness"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - ephemeral-channels-ipc:/run/ach-agent/channels:ro

  engine:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: default
    command: ["--role", "engine"]
    network_mode: service:harness
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /tmp/ach-agent/home:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-m", "ach_agent.healthcheck", "--role", "engine", "--check", "readiness"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - ephemeral-engine-ipc:/run/ach-agent/engine
      - ephemeral-workspace:/tmp/ach-agent/workspace
      - ephemeral-transfer-ipc:/run/ach-agent/transfer

volumes:
  ephemeral-workspace:
  ephemeral-channels-ipc:
  ephemeral-engine-ipc:
  ephemeral-transfer-ipc:
