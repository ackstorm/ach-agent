{{- with .Values.openshell.tls.secret }}
# The operator reads its OpenShell client certificate (OU=operator) from this one Secret at start.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ach-agent.fullname" $ }}-openshell-tls
  namespace: {{ .namespace }}
  labels:
    {{- include "ach-agent.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .name | quote }}]
    verbs: [get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ach-agent.fullname" $ }}-openshell-tls
  namespace: {{ .namespace }}
  labels:
    {{- include "ach-agent.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ach-agent.fullname" $ }}-openshell-tls
subjects:
  - kind: ServiceAccount
    name: {{ include "ach-agent.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
