apiVersion: v1
kind: Pod
metadata:
  name: ach-agent-split
  labels:
    app.kubernetes.io/name: ach-agent
    app.kubernetes.io/component: split
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  shareProcessNamespace: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: harness-config
      configMap:
        name: ach-agent-config
    - name: channels-config
      configMap:
        name: ach-agent-channels
    - name: engine-config
      configMap:
        name: ach-agent-engine
    - name: state
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: workspace
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: public-context
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: engine-home
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: engine-codemem
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: harness-scratch
      emptyDir: {}
    - name: harness-tmp
      emptyDir: {}
    - name: channels-tmp
      emptyDir: {}
    - name: engine-tmp
      emptyDir: {}
  containers:
    - name: harness
      image: ghcr.io/ackstorm/ach-agent:harness
      imagePullPolicy: IfNotPresent
      command: ["python", "-m", "ach_agent.main"]
      args: ["--role", "harness"]
      env:
        - name: ACH_ROLE
          value: harness
        - name: ACH_AGENT_NAME
          value: split-example
        - name: ACH_CONFIG_PATH
          value: /etc/ach-agent/config.yaml
        - name: ACH_ENGINE_URL
          value: http://127.0.0.1:8081
        - name: ACH_BASE_URL
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-base-url
        - name: ACH_HARNESS_HOST
          value: 127.0.0.1
        - name: ACH_HARNESS_PORT
          value: "8090"
        - name: ACH_CHANNELS_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: channels-hmac-key
        - name: ACH_TOKEN
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-token
      ports:
        - name: harness
          containerPort: 8090
      readinessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz')"]
        periodSeconds: 5
      livenessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
        periodSeconds: 10
      securityContext: &restricted
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: harness-config
          mountPath: /etc/ach-agent/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: state
          mountPath: /var/lib/ach-agent/state
          subPath: state
        - name: workspace
          mountPath: /var/lib/ach-agent/workspace
          subPath: workspace
        - name: public-context
          mountPath: /var/lib/ach-agent/public-context
          subPath: public-context
        - name: harness-scratch
          mountPath: /tmp/ach-private
        - name: harness-tmp
          mountPath: /tmp
    - name: channels
      image: ghcr.io/ackstorm/ach-agent:channels
      imagePullPolicy: IfNotPresent
      command: ["python", "-m", "ach_agent.main"]
      args: ["--role", "channels"]
      env:
        - name: ACH_ROLE
          value: channels
        - name: ACH_AGENT_NAME
          value: split-example
        - name: ACH_CHANNELS_CONFIG_PATH
          value: /etc/ach-agent/channels.json
        - name: ACH_HARNESS_URL
          value: http://127.0.0.1:8090
        - name: ACH_CHANNELS_HOST
          value: 0.0.0.0
        - name: ACH_CHANNELS_PORT
          value: "8080"
        - name: ACH_CHANNELS_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: channels-hmac-key
      ports:
        - name: ingress
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /readyz
          port: ingress
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: ingress
        periodSeconds: 10
      securityContext: *restricted
      volumeMounts:
        - name: channels-config
          mountPath: /etc/ach-agent/channels.json
          subPath: channels.json
          readOnly: true
        - name: channels-tmp
          mountPath: /tmp
    - name: engine
      image: ghcr.io/ackstorm/ach-agent:engine-opencode
      imagePullPolicy: IfNotPresent
      command: ["/usr/bin/tini", "--", "python", "-m", "ach_agent.main"]
      args: ["--role", "engine"]
      env:
        - name: ACH_ROLE
          value: engine
        - name: ACH_ENGINE_CONFIG_PATH
          value: /etc/ach-agent/engine.json
        - name: ACH_ENGINE_HOST
          value: 127.0.0.1
        - name: ACH_ENGINE_PORT
          value: "8081"
      ports:
        - name: engine
          containerPort: 8081
      readinessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
        periodSeconds: 5
      livenessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
        periodSeconds: 10
      securityContext: *restricted
      volumeMounts:
        - name: engine-config
          mountPath: /etc/ach-agent/engine.json
          subPath: engine.json
          readOnly: true
        - name: engine-home
          mountPath: /var/lib/ach-agent/home
          subPath: home
        - name: engine-codemem
          mountPath: /var/lib/ach-agent/state
          subPath: engine-codemem
        - name: workspace
          mountPath: /var/lib/ach-agent/workspace
          subPath: workspace
        - name: public-context
          mountPath: /var/lib/ach-agent/public-context
          subPath: public-context
          readOnly: true
        - name: engine-tmp
          mountPath: /tmp
