---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ach-agent-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - achagents
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - achagents/finalizers
  verbs:
  - update
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - achagents/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ach.ackstorm.ai
  resources:
  - agentprofiles
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
