[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ach-agent-runtime"
version = "0.18.0"
description = "ach-agent runtime: control and execution roles (workspace-v3)"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # 2.11 is the actual lower bound: accepted config models (config/public.py) use
    # validate_by_alias/validate_by_name, introduced in pydantic 2.11. >=2.9 advertised a
    # version range this repo does not actually run on.
    "pydantic>=2.11,<3",
    "rfc8785==0.1.4",
    # Task 4 (execution/engine): mini-harness HTTP app + native OpenCode v2 adapter client.
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn==0.50.2",
    # Task 6A (storage): durable CAS core, S3-compatible object store client. Floor set to
    # the version Task6A verified for conditional PutObject IfMatch/IfNoneMatch support
    # (botocore>=1.35.69).
    "boto3>=1.35.69,<2",
    # Workspace legacy-auth slice (harness/tokens.py, execution/auth.py): exact legacy
    # HMAC/Ed25519 primitives, same floor as old-ach-agent/pyproject.toml.
    "cryptography>=44",
    # Legacy typed memory facade and initialized MCP client transport.
    "mcp>=1.28.0,<2",
    # Inbound channel counters copied from the legacy adapter metrics.
    "prometheus-client==0.25.0",
    # Direct legacy croniter/Redis Stream channel adapters.
    "croniter>=6.0.0,<7",
    "redis>=5,<9",
    "structlog==26.1.0",
    "a2a-sdk>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24,<1",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ach_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
