# Pi counterpart of config.yaml. H and E must be switched together.
schemaVersion: "1"
agent:
  name: split-example
model:
  name: gemini.gemini-flash-latest
  type: openai
capability:
  type: ach
  ach:
    environment: platform
prompt:
  system:
    type: text
    text: "You are a concise software-engineering assistant."
persistence:
  enabled: true
  mountPath: /var/lib/ach-agent
engine:
  type: pi
  home: /var/lib/ach-agent/home
  workDir: /var/lib/ach-agent/workspace
  startupTimeoutSeconds: 30
memory:
  type: codemem
  codemem:
    dbPath: /var/lib/ach-agent/state/codemem.db
    project: ach-agent
channels: []
