image:
  operator: ghcr.io/ackstorm/ach-agent-operator
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

openshell:
  # Required: the OpenShell gateway URL, e.g. http://openshell.openshell.svc.cluster.local:8080
  # (https://... with tls.secret).
  gateway: ""
  # Required value in both modes: without tls.secret the gateway is plaintext and unauthenticated,
  # protected only by the mesh; with it the mesh still guards the sandbox service path.
  mesh: istio-ambient
  workspace: default
  podNamespace: openshell
  # Empty: the operator default (https:// with tls.secret).
  serviceURL: ""
  # Plaintext opt-in. Without tls.secret the gateway is unauthenticated and protected only by the
  # mesh; the chart then refuses to render unless this is set true to acknowledge that posture.
  insecurePlaintext: false
  # NetworkPolicy opt-out. A sandbox that can reach the Kubernetes API refuses to start: the cluster
  # does not enforce NetworkPolicy, so the sandbox has open egress by IP. Set true to run anyway.
  insecureWithoutNetworkPolicy: false
  # Gateway mTLS (docs/install.md): the Secret with the operator's client certificate (ca.crt,
  # tls.crt, tls.key; OU=operator), e.g. {namespace: openshell, name: ach-agent-operator-tls}.
  # Set: the operator may read that one Secret and openshell.gateway must be https://.
  # Empty: plaintext gateway (needs insecurePlaintext: true).
  tls:
    secret: {}

runtime:
  storage:
    s3: {bucket: "", region: "", endpointUrl: "", prefix: ach, credentialsSecret: ""}

route:
  parent: {name: "", namespace: "", sectionName: ""}

operator:
  replicas: 1
  leaderElect: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  podLabels: {}
  nodeSelector: {}
  tolerations: []

admissionPolicy:
  enabled: true

metrics:
  # Needs the Prometheus Operator CRDs. Agents run in any namespace, so it selects their control pods cluster-wide.
  podMonitor: {enabled: false, labels: {}}
  # Needs the Prometheus Operator CRDs. labels must match the Prometheus ruleSelector.
  prometheusRule: {enabled: false, labels: {}}
  # Plain ConfigMaps for the Grafana sidecar. labels must match the sidecar's label. annotations place the
  # dashboards in a folder, e.g. {grafana_folder: "100 - Application - ACH Agents"}; the sidecar needs
  # folderAnnotation=grafana_folder and provider.foldersFromFilesStructure=true to honour it.
  dashboards:
    enabled: false
    labels: {grafana_dashboard: "1"}
    annotations: {}

storage:
  # One storage server per Agent namespace in front of a real bucket: control pods save to it and it
  # replicates to the bucket in the background. Runs when enabled and the selected remote has a bucket;
  # then namespaces (the Agent namespaces) are required.
  enabled: true
  namespaces: []
  remote:
    # s3: runtime.storage.s3.{bucket,region,endpointUrl,prefix}; credentials from Pod Identity on the
    # ServiceAccount ach-agent-storage, or runtime.storage.s3.credentialsSecret. region is required.
    # gcs: the bucket below, reachable only through the storage server; credentials from Workload Identity
    # (serviceAccount.annotations) or credentialsSecret, a Secret with the key credentials.json.
    type: s3
    gcs: {bucket: "", project: "", prefix: ach, credentialsSecret: ""}
  serviceAccount:
    # For example iam.gke.io/gcp-service-account for GKE Workload Identity.
    annotations: {}
  # SeaweedFS 4.51 or newer: 4.48 never marks objects written through the server as replicated. Run
  # make storage-smoke before changing it.
  image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
  # The volume holds a cache of the bucket plus whatever S3 does not have yet.
  size: 50Gi
  storageClass: ""
  # Disk usage above which data already in S3 is dropped from the volume, oldest first.
  evictThreshold: 0.8
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
