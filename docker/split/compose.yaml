name: ach-agent-split

services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: harness
    command: ["--role", "harness"]
    environment:
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      ACH_CHANNEL_SOCKET: /run/ach-agent/channels/channel.sock
      ACH_ENGINE_SOCKET: /run/ach-agent/engine/agent.sock
    ports:
      - "8080:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s
    volumes:
      - ./${ACH_HARNESS_CONFIG_FILE:-config.yaml}:/etc/ach-agent/config.yaml:ro
      - harness-state:/var/lib/ach-agent/state
      - shared-workspace:/var/lib/ach-agent/workspace
      - public-context:/var/lib/ach-agent/public-context
      - harness-scratch:/tmp/ach-private
      - channels-ipc:/run/ach-agent/channels
      - engine-ipc:/run/ach-agent/engine:ro

  channels:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: channels
    command: ["--role", "channels"]
    depends_on:
      - harness
    network_mode: service:harness
    environment:
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      ACH_CHANNEL_SOCKET: /run/ach-agent/channels/channel.sock
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s
    volumes:
      - channels-ipc:/run/ach-agent/channels:ro

  engine:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: ${ACH_ENGINE_TARGET:-engine-opencode}
    command: ["--role", "engine"]
    network_mode: service:harness
    environment:
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      ACH_ENGINE_SOCKET: /run/ach-agent/engine/agent.sock
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/execution/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s
    volumes:
      - engine-ipc:/run/ach-agent/engine
      - engine-home:/var/lib/ach-agent/home
      # This E-owned directory is mounted at the logical codemem path. It is
      # intentionally a different volume from H's state/state.db directory.
      - engine-codemem:/var/lib/ach-agent/state
      - shared-workspace:/var/lib/ach-agent/workspace
      - public-context:/var/lib/ach-agent/public-context:ro

volumes:
  harness-state:
  engine-home:
  engine-codemem:
  shared-workspace:
  public-context:
  harness-scratch:
  channels-ipc:
  engine-ipc:
