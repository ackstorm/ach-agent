# Credential-free persistent split example. The operator supplies ACH_TOKEN,
# ACH_BASE_URL and channel keys as environment/Secret references at deployment.
schemaVersion: "1"
agent:
  name: split-example
model:
  name: gemini.gemini-flash-latest
  type: openai
capability:
  type: ach
  ach:
    environment: platform
prompt:
  system:
    type: text
    text: "You are a concise software-engineering assistant."
persistence:
  enabled: true
  mountPath: /var/lib/ach-agent
engine:
  startupTimeoutSeconds: 30
memory:
  type: codemem
  codemem:
    project: ach-agent
channels: []
