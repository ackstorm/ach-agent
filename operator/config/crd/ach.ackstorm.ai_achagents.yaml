                            pattern: ^[A-Za-z0-9!#$%&'*+.^_`|~-]+$
                            type: string
                          secretRef:
                            description: |-
                              SecretRef is the ach-memory user key, bearer arm only. Same env-only mechanism
                              as webhook/a2a: the operator injects the value into the pod from this Secret and
                              renders only the env NAME. NOTE: the key that first bootstraps a project OWNS it —
                              rotating this to a DIFFERENT ach-memory user orphans the bank.
                            properties:
                              key:
                                description: Key is the data key inside the Secret.
                                minLength: 1
                                type: string
                              name:
                                description: Name is the Kubernetes Secret name.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          type:
                            enum:
                            - ach
                            - bearer
                            type: string
                        required:
                        - type
                        type: object
                        x-kubernetes-validations:
                        - message: memory.achMemory.auth.secretRef is required when
                            type=bearer
