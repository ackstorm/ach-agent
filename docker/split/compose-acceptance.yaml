services:
  harness:
    image: ach-agent-split-harness
    ports: !override
      - "127.0.0.1:0:8080"
    environment:
      ACH_BASE_URL: http://mock-upstream:9080
      ACH_TOKEN: split-acceptance-key
      ACH_HARNESS_CONFIG_FILE: ${ACH_HARNESS_CONFIG_FILE:-config-acceptance.yaml}
      DEBUG: harness-value
      CUSTOM_TOOL_TOKEN: harness-token

  channels:
    image: ach-agent-split-channels

  engine:
    image: ach-agent-split-engine
    environment:
      DEBUG: engine-value
      CUSTOM_TOOL_TOKEN: engine-token

  mock-upstream:
    image: ach-agent-split-harness
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["upstream:app", "--app-dir", "/acceptance", "--host", "0.0.0.0", "--port", "9080"]
    volumes:
      - ../../tests/integration/fixtures/upstream.py:/acceptance/upstream.py:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777

volumes:
  engine-home:
  engine-codemem:
  shared-workspace:
  public-context:
