# Workspace and session persistence through the storage server. The session closes 60 s after its
# turn, the Workspace 30 s after that; the close may retry for 300 s.
# The control grace period must cover that close window plus the operator's 15 s margin, so this
# Agent gets its own profile.
apiVersion: ach-agent.ackstorm.ai/v1alpha1
kind: AgentProfile
metadata: {name: e2e-persist, namespace: ach-agent-e2e}
spec:
  control:
    image: ach-agent-control:e2e
    terminationGracePeriodSeconds: 330
  sandbox:
    openshell:
      image: ach-agent-execution:e2e
      resources: {cpu: "1", memory: 1Gi}
      readyTimeoutSeconds: 180
  defaults:
    limits:
      maxActiveWorkspaces: 4
      maxConcurrentInvocations: 4
      maxConcurrentScripts: 2
      maxInvocationSeconds: 300
      maxQueuedTotal: 100
      idempotencyWindowSeconds: 3600
      maxSteps: 10
    engine:
      compaction: {auto: true, keep: {tokens: 8000}, buffer: 20000}
    workspace:
      idleTimeoutSeconds: 600
      shutdownTimeoutSeconds: 30
      maxConcurrentSessions: 1
      persistence: {type: none}
      session:
        idleTimeoutSeconds: 300
    artifacts: {enabled: false, maxArtifactBytes: 1048576, retentionDays: 1}
---
apiVersion: ach-agent.ackstorm.ai/v1alpha1
kind: Agent
metadata: {name: "${NAME}", namespace: ach-agent-e2e}
spec:
  profileRef: {name: e2e-persist}
  capabilityServer: standalone
  standalone:
    model:
      name: e2e-model
      api: openai
      baseUrl: http://e2e-stub.ach-agent-e2e.svc.cluster.local:8090/v1
      headers:
        x-litellm-api-key: {secretKeyRef: {name: e2e-model, key: apiKey}}
  workspace:
    idleTimeoutSeconds: 30
    shutdownTimeoutSeconds: 300
    persistence: {type: s3, retentionDays: 1}
    session:
      idleTimeoutSeconds: 60
  channels:
    - name: hook
      type: webhook
      source: generic
      routing: {sessionKey: "e2e"}
      prompt: "Reply briefly. {{ payload | json }}"
      webhook:
        auth: {type: header_token, header: X-E2E-Token, secretRef: {name: e2e-hook, key: token}}
  expose: {service: true}
