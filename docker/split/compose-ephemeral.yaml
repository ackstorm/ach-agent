name: ach-agent-split-ephemeral

services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: harness
    command: ["--role", "harness"]
    environment:
      ACH_ROLE: harness
      ACH_AGENT_NAME: split-example
      ACH_CONFIG_PATH: /etc/ach-agent/config.yaml
      ACH_ENGINE_URL: http://127.0.0.1:8081
      ACH_HARNESS_HOST: 127.0.0.1
      ACH_HARNESS_PORT: "8090"
      ACH_CHANNELS_HMAC_KEY: ${ACH_CHANNELS_HMAC_KEY:?set ACH_CHANNELS_HMAC_KEY}
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
    ports: ["8080:8080"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /tmp/ach-harness-state:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./${ACH_HARNESS_CONFIG_FILE:-config-ephemeral.yaml}:/etc/ach-agent/config.yaml:ro
      - ephemeral-workspace:/tmp/ach-home/workspace
      - ephemeral-public-context:/tmp/ach-public-context

  channels:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: channels
    command: ["--role", "channels"]
    depends_on: [harness]
    network_mode: service:harness
    environment:
      ACH_ROLE: channels
      ACH_AGENT_NAME: split-example
      ACH_CHANNELS_CONFIG_PATH: /etc/ach-agent/channels.json
      ACH_HARNESS_URL: http://127.0.0.1:8090
      ACH_CHANNELS_HOST: 0.0.0.0
      ACH_CHANNELS_PORT: "8080"
      ACH_CHANNELS_HMAC_KEY: ${ACH_CHANNELS_HMAC_KEY:?set ACH_CHANNELS_HMAC_KEY}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:mode=1777"]
    volumes:
      - ./channels.json:/etc/ach-agent/channels.json:ro

  engine:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: ${ACH_ENGINE_TARGET:-engine-opencode}
    command: ["--role", "engine"]
    network_mode: service:harness
    environment:
      ACH_ROLE: engine
      ACH_ENGINE_CONFIG_PATH: /etc/ach-agent/engine.json
      ACH_ENGINE_HOST: 127.0.0.1
      ACH_ENGINE_PORT: "8081"
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /tmp/ach-home:uid=10001,gid=10001
      - /tmp/ach-home/state:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./${ACH_ENGINE_CONFIG_FILE:-engine-ephemeral.json}:/etc/ach-agent/engine.json:ro
      - ephemeral-workspace:/tmp/ach-home/workspace
      - ephemeral-public-context:/tmp/ach-public-context:ro

volumes:
  ephemeral-workspace:
  ephemeral-public-context:
