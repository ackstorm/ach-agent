# OpenShell gateway values. The gateway is plaintext and unauthenticated: it is safe only behind
# the Istio ambient policy in docs/mesh/openshell-mesh.yaml. The e2e layers openshell-tls-values.yaml
# on top (TLS, operator-only mTLS).
server:
  # TLS is terminated by the mesh (STRICT mTLS).
  disableTls: true
  auth:
    # Authorization is the mesh AuthorizationPolicy: only the operator and Agent namespaces reach it.
    allowUnauthenticatedUsers: true
  # The execution image runs as 10001; OpenShell needs the agent and sandbox to share one UID.
  sandboxUid: "10001"
  sandboxGid: "10001"
  telemetryEnabled: false
pkiInitJob:
  # Sandbox URLs are <ws>--<sb>.<agent ns>.svc.cluster.local (operator ExternalName Services);
  # the chart renders these names into the gateway's server_sans, the domains it routes to sandboxes
  # (with or without TLS). One entry per Agent namespace; with TLS the openshell-server Certificate
  # carries the same names.
  serverDnsNames: ["*.ach-agent-e2e.svc.cluster.local"]
