                    format: int64
                    minimum: 1
                    type: integer
                  maxConcurrentScripts:
                    format: int64
                    minimum: 1
                    type: integer
                  maxInvocationSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxQueuedTotal:
                    format: int64
                    minimum: 1
                    type: integer
