                      - command
                      type: object
                    name:
                      minLength: 1
                      type: string
                    remote:
                      description: |-
                        RemoteMcpSpec is a passthrough remote MCP endpoint opencode connects to directly.
                        headers values are ${env:NAME} refs (NAMES, never secret values); wire the env into
