---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agents.ach-agent.ackstorm.ai
spec:
  group: ach-agent.ackstorm.ai
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profileRef.name
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is a running agent instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec defines the desired state of an Agent.
            properties:
              ach:
                description: AchServerSpec is the capability source of an Agent hydrated
                  from ACH.
                properties:
                  baseUrl:
                    minLength: 1
                    pattern: ^https?://[^/\s]+
                    type: string
                  environment:
                    description: |-
                      Environment is the ACH Hub Environment name. The key already scopes the environment
                      server-side.
                    type: string
                  keySecretRef:
                    description: KeySecretRef points at a Secret holding the ACH key.
                    properties:
                      key:
                        description: Key is the data key inside the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Kubernetes Secret name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  model:
                    description: AchModelSpec selects the ACH-served model.
                    properties:
                      api:
                        default: openai
                        description: API is the wire format of the ACH model route.
                        enum:
                        - openai
                        - anthropic
                        - gemini
                        type: string
                      name:
                        minLength: 1
                        type: string
                      params:
                        x-kubernetes-preserve-unknown-fields: true
                      thinking:
                        description: |-
                          ThinkingSpec is the normalized reasoning intent each engine translates for itself
                          (pi: models.json reasoning + --thinking; opencode: per-call providerOptions).
                        properties:
                          effort:
                            type: string
                          enabled:
                            type: boolean
                        type: object
                    required:
                    - name
                    type: object
                required:
                - baseUrl
                - keySecretRef
                - model
                type: object
              artifacts:
                description: Artifacts is the Harness Artifacts policy (contract §8).
                properties:
                  enabled:
                    type: boolean
                  maxArtifactBytes:
                    format: int64
                    minimum: 1
                    type: integer
                  retentionDays:
                    format: int64
                    minimum: 1
                    type: integer
                type: object
              capabilityServer:
                default: standalone
                description: CapabilityServer selects where the model and tools come
                  from.
                enum:
                - standalone
                - ach
                type: string
              channels:
                items:
                  description: 'ChannelSpec is one inbound channel (config: channels[]).'
                  properties:
                    a2a:
                      description: 'A2ASpec configures an a2a channel (config: channels[].a2a;
                        mode async-only in v1).'
                      properties:
                        auth:
                          description: 'A2AAuthSpec configures a2a inbound auth (config:
                            channels[].a2a.auth; secretRef → secretPath).'
                          properties:
                            header:
                              default: x-a2a-custom-api-key
                              type: string
                            secretRef:
                              description: SecretKeyRef identifies a key in a same-namespace
                                Secret.
                              properties:
                                key:
                                  description: Key is the data key inside the Secret.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the Kubernetes Secret name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - secretRef
                          type: object
                      required:
                      - auth
                      type: object
                    concurrency:
                      default: 1
                      format: int64
                      minimum: 1
                      type: integer
                    cron:
                      description: 'CronSpec configures a cron channel (config: channels[].cron).'
                      properties:
                        schedule:
                          type: string
                        timezone:
                          default: UTC
                          type: string
                      required:
                      - schedule
                      type: object
                    handoff:
                      description: |-
                        Handoff runs in the harness, in an empty directory; its output wholesale-replaces the
                        session workspace's handoff/ (content-agnostic — a repo clone, a DB extract, arbitrary
                        files). It runs every invocation; for per-session files set
                        routing.workspaceKey: session. Valid for every channel type.
                      properties:
                        destination:
                          description: |-
                            Destination is the relative path inside the Workspace the handoff's output replaces
                            (contract §6). Required, non-empty. Path-escape rejection (no .. segments, no leading
                            /) happens at runtime (Harness) — a CEL equivalent here is prohibitively expensive
                            against the per-channel listType=map cost multiplier.
                          minLength: 1
                          type: string
                        forwardEnv:
                          description: |-
                            ForwardEnv selects names from the merged AgentProfile.spec.control.env + Agent.spec.env.
                            Literal values become the hook's env; secretKeyRef values become its secretEnv via
                            generated Pod aliases. Unknown names are ignored and remain unset.
                          items:
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        script:
                          description: |-
                            Script is the static /bin/sh program. Lifecycle hooks feed it to `sh -eu -s`;
                            webhook-script uses `sh -eu -c` so stdin remains available for webhook JSON.
                          minLength: 1
                          type: string
                        timeoutSeconds:
                          description: |-
                            TimeoutSeconds bounds the hook script; on expiry the harness SIGKILLs its process
                            group. Harness default is 120 when omitted.
                          format: int64
                          maximum: 3600
                          minimum: 1
                          type: integer
                      required:
                      - destination
                      - script
                      type: object
                    name:
                      minLength: 1
                      type: string
                    prompt:
                      type: string
                    queue:
                      description: 'QueueSpec configures a redis queue channel (config:
                        channels[].queue; type/ackMode are constants).'
                      properties:
                        key:
                          type: string
                      required:
                      - key
                      type: object
                    routing:
                      description: |-
                        Routing overrides the Harness's default Workspace/Session identity for this
                        channel (contract §2). Omit for the adapter's default.
                      properties:
                        sessionKey:
                          description: SessionKey overrides the adapter's default
                            Session identity template.
                          minLength: 1
                          type: string
                        workspaceKey:
                          description: |-
                            WorkspaceKey overrides the adapter's default Workspace identity template. The
                            reserved keyword "session" gives each session its own workspace.
                          minLength: 1
                          type: string
                      type: object
                    script:
                      description: |-
                        Script is the deterministic handler for type=webhook-script. The normalized webhook
                        JSON is passed on stdin; the harness never invokes the agent engine. Its workspace is
                        temporary and removed after each event.
                      properties:
                        forwardEnv:
                          description: |-
                            ForwardEnv selects names from the merged AgentProfile.spec.control.env + Agent.spec.env.
                            Literal values become the hook's env; secretKeyRef values become its secretEnv via
                            generated Pod aliases. Unknown names are ignored and remain unset.
                          items:
                            pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                        script:
                          description: |-
                            Script is the static /bin/sh program. Lifecycle hooks feed it to `sh -eu -s`;
                            webhook-script uses `sh -eu -c` so stdin remains available for webhook JSON.
                          minLength: 1
                          type: string
                        timeoutSeconds:
                          description: |-
                            TimeoutSeconds bounds the hook script; on expiry the harness SIGKILLs its process
                            group. Harness default is 120 when omitted.
                          format: int64
                          maximum: 3600
                          minimum: 1
                          type: integer
                      required:
                      - script
                      type: object
                    source:
                      enum:
                      - gitlab
                      - github
                      - generic
                      type: string
                    type:
                      enum:
                      - webhook
                      - webhook-script
                      - cron
                      - queue
                      - a2a
                      type: string
                    webhook:
                      description: WebhookSpec configures webhook ingress for model
                        and deterministic-script channels.
                      properties:
                        auth:
                          description: 'WebhookAuthSpec configures webhook auth (config:
                            channels[].webhook.auth; secretRef → secretPath).'
                          properties:
                            header:
                              type: string
                            secretRef:
                              description: SecretKeyRef identifies a key in a same-namespace
                                Secret.
                              properties:
                                key:
                                  description: Key is the data key inside the Secret.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the Kubernetes Secret name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            type:
                              enum:
                              - gitlab_token
                              - hmac
                              - header_token
                              - none
                              type: string
                          required:
                          - type
                          type: object
                          x-kubernetes-validations:
                          - message: webhook.auth.secretRef is required unless type=none
                            rule: self.type=='none' || has(self.secretRef)
                          - message: webhook.auth.header is required when type=header_token
                            rule: self.type!='header_token' || (has(self.header) &&
                              size(self.header)>0)
                        botUsername:
                          description: |-
                            BotUsername is the GitLab username the agent posts AS (the egress PAT's
                            user — a distinct fact from the agent name). When set, the harness drops
                            inbound events authored by this user plus gitlab-generated system notes
                            pre-enqueue (loop-guard). Omit → guard off. gitlab source only; ignored
                            for github/generic. Rendered verbatim to channels[].webhook.botUsername.
                          type: string
                        gitlabEvents:
                          items:
                            enum:
                            - merge_request
                            - issue
                            - note
                            - push
                            - project_create
                            - project_rename
                            - project_transfer
                            - project_update
                            - repository_update
                            type: string
                          type: array
                        mergeRequestsOnly:
                          description: |-
                            MergeRequestsOnly discards GitLab issues and notes not on a merge request before
                            admission (contract §2). gitlab source only; ignored for github/generic.
                          type: boolean
                        triggerUsers:
                          description: |-
                            TriggerUsers is an actor allowlist: only these GitLab usernames may trigger
                            the handler. Omit → any author triggers. System events without a username are
                            rejected when this list is set, so webhook-script registrars should omit it.
                            GitLab source only; ignored for github/generic.
                          items:
                            type: string
                          type: array
                      required:
                      - auth
                      type: object
                  required:
                  - name
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: 'channels: the block matching type is required'
                    rule: ((self.type=='webhook' || self.type=='webhook-script') &&
                      has(self.webhook)) || (self.type=='cron' && has(self.cron))
                      || (self.type=='queue' && has(self.queue)) || (self.type=='a2a'
                      && has(self.a2a))
                  - message: channels.source is only valid for webhook channels
                    rule: self.type=='webhook' || self.type=='webhook-script' || !has(self.source)
                  - message: channels.script is required only for webhook-script
                    rule: 'self.type==''webhook-script'' ? has(self.script) : !has(self.script)'
                  - message: webhook-script forbids prompt and handoff
                    rule: self.type!='webhook-script' || (!has(self.prompt) && !has(self.handoff))
                  - message: generic webhook and queue channels require routing.sessionKey
                    rule: '!(self.type==''queue'' || (self.type==''webhook'' && has(self.source)
                      && self.source==''generic'')) || (has(self.routing) && has(self.routing.sessionKey))'
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              engine:
                description: |-
                  EngineSpec is the harness-local engine block (config: engine.*). Unset fields are omitted
                  (the harness defaults them). home/workDir/idleTtlSeconds/maxToolCalls/type/pi were retired
                  for workspace-v1 (contract §10): one engine (OpenCode v2), no placements/binaries/paths to
                  select, and tool-call counting is replaced by limits.maxSteps.
                properties:
                  compaction:
                    description: |-
                      Compaction configures OpenCode's native context compaction (contract §4). Replaces the
                      retired session.maxTokens/overflow knobs.
                    properties:
                      auto:
                        type: boolean
                      buffer:
                        format: int64
                        minimum: 0
                        type: integer
                      keep:
                        description: |-
                          Keep is resolved as one atomic sub-block (its only field, tokens, has no independent
                          meaning to override alone) — same convention as Persistence/Session below.
                        properties:
                          tokens:
                            format: int64
                            minimum: 0
                            type: integer
                        type: object
                    type: object
                  denyTools:
                    description: |-
                      DenyTools names native OpenCode tools (e.g. question, execute, websearch, webfetch)
                      hidden from the managed agent's model. MCP tools are governed by
                      ach.capability.filter.exclude.tools; a dotted name is MCP syntax and is rejected.
                    items:
                      pattern: ^[A-Za-z0-9_-]+$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  forwardEnv:
                    description: |-
                      ForwardEnv selects literal-valued names from the merged env to the engine subprocess
                      (contract §5). Only literal values are permitted — a name resolving to a secretKeyRef,
                      a reserved name or a name absent from the merged env is a configuration error
                      (agentrender.Render), not a silent drop.
                    items:
                      type: string
                    type: array
                  startupTimeoutSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                type: object
              env:
                description: |-
                  Env are pod-level environment variables merged over AgentProfile.spec.control.env by
                  name. An agent entry replaces the complete inherited EnvVar. Reserved ACH_* names are
                  forbidden; only literal values and secretKeyRef sources are supported.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: env must not set reserved ACH_* vars
                  rule: self.all(e, !e.name.startsWith('ACH_'))
                - message: env valueFrom supports only secretKeyRef
                  rule: self.all(e, !has(e.valueFrom) || (has(e.valueFrom.secretKeyRef)
                    && !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef)
                    && !has(e.valueFrom.resourceFieldRef) && !has(e.valueFrom.fileKeyRef)))
                - message: env value and valueFrom are mutually exclusive
                  rule: self.all(e, !has(e.valueFrom) || !has(e.value) || e.value
                    == '')
              expose:
                description: Expose controls reachability. Omit for a fully private
                  agent.
                properties:
                  route:
                    description: RouteSpec publishes the Agent through a Gateway API
                      HTTPRoute.
                    properties:
                      hostname:
                        minLength: 1
                        type: string
                      parentRef:
                        description: ParentRef defaults to the operator's configured
                          Gateway.
                        properties:
                          name:
                            minLength: 1
                            type: string
                          namespace:
                            type: string
                          sectionName:
                            type: string
                        required:
                        - name
                        type: object
                      path:
                        default: /
                        description: Path is the URL prefix on hostname; the HTTPRoute
                          strips it before the control pod.
                        type: string
                    required:
                    - hostname
                    type: object
                  service:
                    description: |-
                      Service creates the ClusterIP Service so in-cluster peers (a2a) or an ingress can reach
                      the control pod. Required for any inbound HTTP channel to be reachable at all.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: expose.route requires expose.service
                  rule: '!has(self.route) || self.service'
              filter:
                description: Filter is the governance gate above the model, in both
                  modes.
                properties:
                  exclude:
                    description: 'ExcludeSpec is the governance gate ABOVE the model
                      (config: capability.filter.exclude).'
                    properties:
                      mcpServers:
                        items:
                          type: string
                        type: array
                      skills:
                        items:
                          type: string
                        type: array
                      tools:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              hooks:
                description: |-
                  Hooks are agent-level workspace and session lifecycle hooks, run inside the sandbox
                  with only engine.forwardEnv variables.
                properties:
                  sessionRestore:
                    description: |-
                      SessionRestore runs once each time a session is restored from a snapshot (contract §6).
                      Failure fails the invocation. Never runs alongside SessionStart for the same session —
                      Start is create-only, Restore is restore-only.
                    properties:
                      script:
                        minLength: 1
                        type: string
                      timeoutSeconds:
                        format: int64
                        maximum: 3600
                        minimum: 1
                        type: integer
                    required:
                    - script
                    type: object
                  sessionStart:
                    description: |-
                      SessionStart runs once per new session, after the handoff and before the first turn.
                      It is a run gate: exit 0 appends its stdout to the prompt, exit 78 skips the run
                      without an engine call, and any other non-zero exit fails the invocation.
                    properties:
                      script:
                        minLength: 1
                        type: string
                      timeoutSeconds:
                        format: int64
                        maximum: 3600
                        minimum: 1
                        type: integer
                    required:
                    - script
                    type: object
                  sessionSuspend:
                    description: |-
                      SessionSuspend runs every time the session's engine stops (idle, shutdown, sandbox
                      suspend), before any HOME archive. May run many times per session. Best-effort.
                    properties:
                      script:
                        minLength: 1
                        type: string
                      timeoutSeconds:
                        format: int64
                        maximum: 3600
                        minimum: 1
                        type: integer
                    required:
                    - script
                    type: object
                  workspaceStart:
                    description: |-
                      WorkspaceStart runs once in the execution pod after the workspace is restored (or
                      created), before any session. Best-effort: a failure raises the alarm
                      workspace_start_failed and never blocks. Requires ach-runtime >= 0.1.13.
                    properties:
                      script:
                        minLength: 1
                        type: string
                      timeoutSeconds:
                        format: int64
                        maximum: 3600
                        minimum: 1
                        type: integer
                    required:
                    - script
                    type: object
                  workspaceStop:
                    description: |-
                      WorkspaceStop runs once before the workspace snapshot/close. Best-effort: a failure
                      raises the alarm workspace_stop_failed. Requires ach-runtime >= 0.1.13.
                    properties:
                      script:
                        minLength: 1
                        type: string
                      timeoutSeconds:
                        format: int64
                        maximum: 3600
                        minimum: 1
                        type: integer
                    required:
                    - script
                    type: object
                type: object
              limits:
                description: |-
                  LimitsSpec bounds invocations (config: limits.*, contract §3). Fields stay POINTERS
                  (except MaxSteps, below) so an agent can override one limit without restating the rest —
                  per-field merge via ResolveLimits. The wire schema requires every field but
                  maxConcurrentScripts unconditionally, but that completeness is checked on the RESOLVED
                  result (RenderLimitsV1), not by forcing the type non-pointer.
                properties:
                  idempotencyWindowSeconds:
                    format: int64
                    minimum: 1
                    type: integer
                  maxActiveWorkspaces:
                    format: int64
                    minimum: 1
                    type: integer
                  maxConcurrentInvocations:
                    format: int64
                    minimum: 1
                    type: integer
                  maxConcurrentScripts:
                    format: int64
                    minimum: 1
                    type: integer
                  maxInvocationSeconds:
