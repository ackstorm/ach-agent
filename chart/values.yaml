image:
  operator: ghcr.io/ackstorm/ach-agent-operator
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

openshell:
  # Required: the OpenShell gateway URL, e.g. http://openshell.openshell.svc.cluster.local:8080
  gateway: ""
  # Required value: the gateway is plaintext and unauthenticated, protected only by the mesh.
  mesh: istio-ambient
  workspace: default
  podNamespace: openshell
  # Empty: the operator default.
  serviceURL: ""

runtime:
  storage:
    s3: {bucket: "", region: "", endpointUrl: "", prefix: ach, credentialsSecret: ""}

route:
  parent: {name: "", namespace: "", sectionName: ""}

operator:
  replicas: 1
  leaderElect: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  podLabels: {}
  nodeSelector: {}
  tolerations: []

admissionPolicy:
  enabled: true

metrics:
  # Needs the Prometheus Operator CRDs. Agents run in any namespace, so it selects their control pods cluster-wide.
  podMonitor: {enabled: false, labels: {}}
  # Needs the Prometheus Operator CRDs. labels must match the Prometheus ruleSelector.
  prometheusRule: {enabled: false, labels: {}}
  # Plain ConfigMaps for the Grafana sidecar. labels must match the sidecar's label. annotations place the
  # dashboards in a folder, e.g. {grafana_folder: "100 - Application - ACH Agents"}; the sidecar needs
  # folderAnnotation=grafana_folder and provider.foldersFromFilesStructure=true to honour it.
  dashboards:
    enabled: false
    labels: {grafana_dashboard: "1"}
    annotations: {}
