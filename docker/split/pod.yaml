apiVersion: v1
kind: Pod
metadata:
  name: ach-agent-split
  labels:
    app.kubernetes.io/name: ach-agent
    app.kubernetes.io/component: split
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  shareProcessNamespace: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: harness-config
      configMap:
        name: ach-agent-config
    - name: channels-bootstrap
      emptyDir: {}
    - name: engine-bootstrap
      emptyDir: {}
    - name: state
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: workspace
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: public-context
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: engine-home
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: engine-codemem
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: harness-scratch
      emptyDir: {}
    - name: harness-tmp
      emptyDir: {}
    - name: channels-tmp
      emptyDir: {}
    - name: engine-tmp
      emptyDir: {}
  containers:
    - name: harness
      image: ghcr.io/ackstorm/ach-agent:harness
      imagePullPolicy: IfNotPresent
      args: ["--role", "harness"]
      env:
        - name: ACH_BASE_URL
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-base-url
        - name: ACH_TOKEN
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-token
      ports:
        - name: harness
          containerPort: 8090
      readinessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz')"]
        periodSeconds: 5
      startupProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      livenessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
        periodSeconds: 10
      securityContext: &restricted
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: harness-config
          mountPath: /etc/ach-agent/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: state
          mountPath: /var/lib/ach-agent/state
          subPath: state
        - name: workspace
          mountPath: /var/lib/ach-agent/workspace
          subPath: workspace
        - name: public-context
          mountPath: /var/lib/ach-agent/public-context
          subPath: public-context
        - name: harness-scratch
          mountPath: /tmp/ach-private
        - name: harness-tmp
          mountPath: /tmp
        - name: channels-bootstrap
          mountPath: /run/ach-agent/channels
        - name: engine-bootstrap
          mountPath: /run/ach-agent/engine
    - name: channels
      image: ghcr.io/ackstorm/ach-agent:channels
      imagePullPolicy: IfNotPresent
      args: ["--role", "channels"]
      ports:
        - name: ingress
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /readyz
          port: ingress
        periodSeconds: 5
      startupProbe:
        httpGet:
          path: /healthz
          port: ingress
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      livenessProbe:
        httpGet:
          path: /healthz
          port: ingress
        periodSeconds: 10
      securityContext: *restricted
      volumeMounts:
        - name: channels-bootstrap
          mountPath: /run/ach-agent/channels
          readOnly: true
        - name: channels-tmp
          mountPath: /tmp
    - name: engine
      image: ghcr.io/ackstorm/ach-agent:engine-opencode
      imagePullPolicy: IfNotPresent
      args: ["--role", "engine"]
      ports:
        - name: engine
          containerPort: 8081
      readinessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz')"]
        periodSeconds: 5
      startupProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
      livenessProbe:
        exec:
          command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
        periodSeconds: 10
      securityContext: *restricted
      volumeMounts:
        - name: engine-bootstrap
          mountPath: /run/ach-agent/engine
          readOnly: true
        - name: engine-home
          mountPath: /var/lib/ach-agent/home
          subPath: home
        - name: engine-codemem
          mountPath: /var/lib/ach-agent/state
          subPath: engine-codemem
        - name: workspace
          mountPath: /var/lib/ach-agent/workspace
          subPath: workspace
        - name: public-context
          mountPath: /var/lib/ach-agent/public-context
          subPath: public-context
          readOnly: true
        - name: engine-tmp
          mountPath: /tmp
