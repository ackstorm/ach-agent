{{- include "ach-agent.validate" . -}}
{{- $s3 := .Values.runtime.storage.s3 -}}
{{- $parent := .Values.route.parent -}}
{{- $storage := eq (include "ach-agent.storage.active" .) "true" -}}
{{- /* With gcs the control pods' S3 bucket is the storage server's bucket, named after the GCS bucket; the
region only names the signing scope, which the storage server accepts for any region. */ -}}
{{- $gcs := eq .Values.storage.remote.type "gcs" -}}
{{- $gcsRemote := .Values.storage.remote.gcs -}}
{{- $tls := .Values.openshell.tls.secret -}}
{{- $serviceURL := .Values.openshell.serviceURL -}}
{{- if and $tls (not $serviceURL) -}}
{{- $serviceURL = "https://{workspace}--{sandbox}.{namespace}.svc.cluster.local:8080" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ach-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "ach-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ach-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        istio.io/dataplane-mode: ambient
    spec:
      serviceAccountName: {{ include "ach-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.operator }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: ACH_AGENT_OPENSHELL_GATEWAY
              value: {{ .Values.openshell.gateway | quote }}
            - name: ACH_AGENT_OPENSHELL_WORKSPACE
              value: {{ .Values.openshell.workspace | quote }}
            - name: ACH_AGENT_OPENSHELL_POD_NAMESPACE
              value: {{ .Values.openshell.podNamespace | quote }}
            {{- with $serviceURL }}
            - name: ACH_AGENT_OPENSHELL_SERVICE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.openshell.insecureWithoutNetworkPolicy }}
            - name: ACH_AGENT_INSECURE_WITHOUT_NETWORK_POLICY
              value: "true"
            {{- end }}
            {{- with $tls }}
            - name: ACH_AGENT_OPENSHELL_TLS_SECRET
              value: {{ printf "%s/%s" .namespace .name | quote }}
            {{- end }}
            - name: ACH_AGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ACH_AGENT_STORAGE_S3_BUCKET
              value: {{ ternary $gcsRemote.bucket $s3.bucket $gcs | quote }}
            - name: ACH_AGENT_STORAGE_S3_REGION
              value: {{ ternary "us-east-1" $s3.region $gcs | quote }}
            - name: ACH_AGENT_STORAGE_S3_ENDPOINT_URL
              value: {{ ternary "http://ach-agent-storage:8333" $s3.endpointUrl $storage | quote }}
            - name: ACH_AGENT_STORAGE_S3_PREFIX
              value: {{ ternary $gcsRemote.prefix $s3.prefix $gcs | quote }}
            - name: ACH_AGENT_STORAGE_S3_CREDENTIALS_SECRET
              value: {{ ternary "ach-agent-storage-s3" $s3.credentialsSecret $storage | quote }}
            - name: ACH_AGENT_ROUTE_PARENT_NAME
              value: {{ $parent.name | quote }}
            - name: ACH_AGENT_ROUTE_PARENT_NAMESPACE
              value: {{ $parent.namespace | quote }}
            - name: ACH_AGENT_ROUTE_PARENT_SECTION
              value: {{ $parent.sectionName | quote }}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if $tls }}
          # The operator writes its gateway TLS material here (read-only root filesystem).
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          {{- end }}
      {{- if $tls }}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
      {{- end }}
