---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agentprofiles.ach-agent.ackstorm.ai
spec:
  group: ach-agent.ackstorm.ai
  names:
    kind: AgentProfile
    listKind: AgentProfileList
    plural: agentprofiles
    singular: agentprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.control.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentProfile is the reusable infrastructure and defaults for
          a class of Agents.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentProfileSpec is the reusable infrastructure + defaults half. Agent-scoped defaults live
              under defaults and deep-merge with an Agent's inline overrides (agent field wins).
            properties:
              control:
                description: ControlSpec is the infrastructure of the control pod
                  every Agent using the profile runs.
                properties:
                  env:
                    description: |-
                      Env are pod-level environment variables inherited by Agents using this profile.
                      Reserved ACH_* names are forbidden because the operator owns that namespace. Only
                      literal values and secretKeyRef sources are supported.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: env must not set reserved ACH_* vars
                      rule: self.all(e, !e.name.startsWith('ACH_'))
                    - message: env valueFrom supports only secretKeyRef
                      rule: self.all(e, !has(e.valueFrom) || (has(e.valueFrom.secretKeyRef)
                        && !has(e.valueFrom.configMapKeyRef) && !has(e.valueFrom.fieldRef)
                        && !has(e.valueFrom.resourceFieldRef) && !has(e.valueFrom.fileKeyRef)))
                    - message: env value and valueFrom are mutually exclusive
                      rule: self.all(e, !has(e.valueFrom) || !has(e.value) || e.value
                        == '')
                  image:
                    description: Image is the control image (runtime role control).
                    minLength: 1
                    type: string
                  imagePullSecrets:
                    items:
                      description: |-
                        LocalObjectReference contains enough information to let you locate the
                        referenced object inside the same namespace.
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  persistence:
                    description: Persistence is the control unit's PVC.
                    properties:
                      enabled:
                        type: boolean
                      mountPath:
                        default: /var/lib/ach-agent
                        type: string
                      retainPolicy:
                        description: |-
                          RetainPolicy controls PVC lifecycle on Agent deletion. Retain → the PVC is created
                          WITHOUT a controller owner-ref, so it survives agent deletion (operator-managed cleanup).
                        enum:
                        - Retain
                        - Delete
                        type: string
                      size:
                        type: string
                      storageClassName:
                        type: string
                    required:
                    - enabled
                    type: object
                    x-kubernetes-validations:
                    - message: persistence.size is required when persistence.enabled=true
                      rule: '!self.enabled || (has(self.size) && size(self.size) >
                        0)'
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  serviceAccountName:
                    description: |-
                      ServiceAccountName, when set, is an existing ServiceAccount the control pods run as,
                      instead of the per-Agent ach-agent-control-<uid>. The operator does not create, own or
                      delete it: it must already exist in the Agent's namespace.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  terminationGracePeriodSeconds:
                    description: |-
                      TerminationGracePeriodSeconds must be at least workspace.shutdownTimeoutSeconds + 15
                      (the runtime drain plus margin); the operator reports InvalidGracePeriod otherwise.
                    format: int64
                    minimum: 0
                    type: integer
                  tolerations:
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                required:
                - image
                type: object
              defaults:
                description: |-
                  AgentDefaults is the shared set of profile defaults that an agent may override.
                  AgentProfile.spec.defaults names these defaults, and AgentSpec embeds this type inline.
                  Resolution is a per-field deep merge: a field set on the agent wins, while an omitted
                  field inherits from the profile. Slices, maps, and nested blocks are atomic and are not
                  recursively merged. The resolvers are the source of truth for this behavior.
                properties:
                  artifacts:
                    description: Artifacts is the Harness Artifacts policy (contract
                      §8).
                    properties:
                      enabled:
                        type: boolean
                      maxArtifactBytes:
                        format: int64
                        minimum: 1
                        type: integer
                      retentionDays:
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  engine:
                    description: |-
                      EngineSpec is the harness-local engine block (config: engine.*). Unset fields are omitted
                      (the harness defaults them). home/workDir/idleTtlSeconds/maxToolCalls/type/pi were retired
                      for workspace-v1 (contract §10): one engine (OpenCode v2), no placements/binaries/paths to
                      select, and tool-call counting is replaced by limits.maxSteps.
                    properties:
                      compaction:
                        description: |-
                          Compaction configures OpenCode's native context compaction (contract §4). Replaces the
                          retired session.maxTokens/overflow knobs.
                        properties:
                          auto:
                            type: boolean
                          buffer:
                            format: int64
                            minimum: 0
                            type: integer
                          keep:
                            description: |-
                              Keep is resolved as one atomic sub-block (its only field, tokens, has no independent
                              meaning to override alone) — same convention as Persistence/Session below.
                            properties:
                              tokens:
                                format: int64
                                minimum: 0
                                type: integer
                            type: object
                        type: object
                      denyTools:
                        description: |-
                          DenyTools names native OpenCode tools (e.g. question, execute, websearch, webfetch)
                          hidden from the managed agent's model. MCP tools are governed by
                          ach.capability.filter.exclude.tools; a dotted name is MCP syntax and is rejected.
                        items:
                          pattern: ^[A-Za-z0-9_-]+$
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      forwardEnv:
                        description: |-
                          ForwardEnv selects literal-valued names from the merged env to the engine subprocess
                          (contract §5). Only literal values are permitted — a name resolving to a secretKeyRef,
                          a reserved name or a name absent from the merged env is a configuration error
                          (agentrender.Render), not a silent drop.
                        items:
                          type: string
                        type: array
                      startupTimeoutSeconds:
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  limits:
                    description: |-
                      LimitsSpec bounds invocations (config: limits.*, contract §3). Fields stay POINTERS
                      (except MaxSteps, below) so an agent can override one limit without restating the rest —
                      per-field merge via ResolveLimits. The wire schema requires every field but
                      maxConcurrentScripts unconditionally, but that completeness is checked on the RESOLVED
                      result (RenderLimitsV1), not by forcing the type non-pointer.
                    properties:
                      idempotencyWindowSeconds:
                        format: int64
                        minimum: 1
                        type: integer
                      maxActiveWorkspaces:
                        format: int64
                        minimum: 1
                        type: integer
                      maxConcurrentInvocations:
                        format: int64
                        minimum: 1
                        type: integer
                      maxConcurrentScripts:
                        format: int64
                        minimum: 1
                        type: integer
                      maxInvocationSeconds:
                        format: int64
                        minimum: 1
                        type: integer
                      maxQueuedTotal:
                        format: int64
                        minimum: 1
                        type: integer
                      maxSteps:
                        description: |-
                          MaxSteps bounds OpenCode steps per invocation (contract §3: no unlimited value). A
                          POINTER like every other field here, so an agent can override one limit (e.g. just
                          maxSteps, or everything EXCEPT maxSteps) without being forced to restate the rest of
                          the block just to satisfy a non-pointer required field — completeness of the full
                          resolved limits block is still enforced, but at RenderLimitsV1 (the merged result),
                          not by forcing every partial override to carry every field.
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                  workspace:
                    description: Workspace is the Harness Workspace/session lifecycle
                      policy (contract §3/§7).
                    properties:
                      idleTimeoutSeconds:
                        format: int64
                        minimum: 0
                        type: integer
                      maxConcurrentSessions:
                        description: |-
                          MaxConcurrentSessions bounds sessions executing work simultaneously in a Workspace.
                          A handoff with a shared destination requires this to be 1 (contract §6).
                        format: int64
                        minimum: 1
                        type: integer
                      persistence:
                        description: |-
                          WorkspacePersistenceSpec is a Workspace or session durability switch (contract §7:
                          workspace.persistence, workspace.session.persistence). This is the Harness/Storage logical
                          policy — distinct from AgentProfileSpec.Persistence, which is the operator's ephemeral
                          control/execution-pod active-volume infrastructure.
                          WorkspacePersistenceSpec is a Workspace or session durability switch (contract §7:
                          workspace.persistence, workspace.session.persistence). This is the Harness/Storage logical
                          policy — distinct from AgentProfileSpec.Persistence, which is the operator's ephemeral
                          control/execution-pod active-volume infrastructure. Both fields are required: the wire
                          schema requires retentionDays unconditionally, even when enabled=false.
                          Both Enabled and RetentionDays are pointers so an agent can override either one alone
                          (ResolvePersistence per-field merge) without restating the other just to satisfy a
                          non-pointer required field — e.g. `persistence: {enabled: false}` must inherit the
                          profile's retentionDays, not null it out. Completeness of the resolved block (both
                          fields set) is enforced at RenderWorkspaceV1/RenderArtifactsV1 time, same as every other
                          policy block.
                        properties:
                          enabled:
                            type: boolean
                          retentionDays:
                            format: int64
                            minimum: 1
                            type: integer
                        type: object
                      session:
                        description: 'WorkspaceSessionSpec is workspace.session (contract
                          §7). Pointer fields: per-field merge.'
                        properties:
                          idleTimeoutSeconds:
                            format: int64
                            minimum: 0
                            type: integer
                          persistence:
                            description: |-
                              Persistence is resolved as one atomic sub-block (same convention as
                              CompactionSpec.Keep): its two fields are only meaningful together.
                            properties:
                              enabled:
                                type: boolean
                              retentionDays:
                                format: int64
                                minimum: 1
                                type: integer
                            type: object
                        type: object
                      shutdownTimeoutSeconds:
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                type: object
              sandbox:
                description: |-
                  ProfileSandboxSpec selects the sandbox. OpenShell is the only one; another sandbox later
                  becomes a sibling block.
                properties:
                  openshell:
                    description: OpenShellSpec is the OpenShell sandbox every Workspace
                      of the profile's Agents runs in.
                    properties:
                      image:
                        minLength: 1
                        type: string
                      policy:
                        description: |-
                          Policy is the OpenShell sandbox policy (snake_case proto JSON), merged under the
                          Agent's own policy. Rule names starting with ach-agent- are reserved.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      readyTimeoutSeconds:
                        description: |-
                          ReadyTimeoutSeconds is how long a new sandbox has to become ready, rendered as the
                          control config's workspace.readyTimeoutSeconds. Omitted: the runtime default.
                        format: int64
                        minimum: 1
                        type: integer
                      resources:
                        description: SandboxResources maps onto the OpenShell sandbox
                          template resources.
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                        type: object
                    required:
                    - image
                    type: object
                required:
                - openshell
                type: object
            required:
            - control
            - defaults
            - sandbox
            type: object
          status:
            description: 'AgentProfileStatus is minimal: profiles are read by Agent
              and have no side effects.'
            properties:
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: AgentProfile name must be <= 50 chars (operator derives <=63-char
            child names)
          rule: size(self.metadata.name) <= 50
        - message: spec.sandbox.openshell.image is required (nonempty)
          rule: has(self.spec.sandbox) && has(self.spec.sandbox.openshell) && has(self.spec.sandbox.openshell.image)
            && size(self.spec.sandbox.openshell.image) > 0
        - message: spec.defaults.limits is required — it is the only place a profile
            is guaranteed to set limits.maxSteps, which the runtime requires on every
            agent (positive, never unlimited)
          rule: has(self.spec.defaults) && has(self.spec.defaults.limits)
        - message: spec.defaults.engine.compaction is required — the wire schema requires
            it unconditionally and no harness default is published
          rule: has(self.spec.defaults) && has(self.spec.defaults.engine) && has(self.spec.defaults.engine.compaction)
        - message: spec.defaults.workspace is required — the wire schema requires
            every workspace.* field unconditionally
          rule: has(self.spec.defaults) && has(self.spec.defaults.workspace)
        - message: spec.defaults.artifacts is required — the wire schema requires
            every artifacts.* field unconditionally
          rule: has(self.spec.defaults) && has(self.spec.defaults.artifacts)
    served: true
    storage: true
    subresources:
      status: {}
