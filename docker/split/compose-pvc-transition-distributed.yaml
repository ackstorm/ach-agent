services:
  harness:
    image: ${ACH_IMAGE:?set ACH_IMAGE}
    command: ["--role", "harness"]
    environment:
      ACH_TOKEN: pvc-transition-key
      ACH_BASE_URL: http://pvc-upstream:9080
      ACH_CONFIG_PATH: /etc/ach-agent/config.yaml
    ports:
      - "127.0.0.1:0:8080"
    volumes:
      - ${ACH_CONFIG_FILE:-../../tests/integration/fixtures/pvc-transition-config.yaml}:/etc/ach-agent/config.yaml:ro
      - ${PVC_DIR:?set PVC_DIR}/state:/base/state
      - ${PVC_DIR:?set PVC_DIR}/home/workspace:/base/home/workspace
      - pvc-channels:/run/ach-agent/channels
      - pvc-engine-ipc:/run/ach-agent/engine:ro
      - pvc-transfer:/run/ach-agent/transfer
    depends_on:
      pvc-upstream:
        condition: service_healthy

  channels:
    image: ${ACH_IMAGE:?set ACH_IMAGE}
    command: ["--role", "channels"]
    network_mode: service:harness
    environment:
      ACH_TOKEN: pvc-transition-key
      ACH_BASE_URL: http://pvc-upstream:9080
    volumes:
      - pvc-channels:/run/ach-agent/channels:ro

  engine:
    image: ${ACH_IMAGE:?set ACH_IMAGE}
    command: ["--role", "engine"]
    network_mode: service:harness
    volumes:
      - pvc-engine-ipc:/run/ach-agent/engine
      - pvc-transfer:/run/ach-agent/transfer
      - ${PVC_DIR:?set PVC_DIR}/home:/base/home

  pvc-upstream:
    image: ${ACH_IMAGE:?set ACH_IMAGE}
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["pvc_transition_upstream:app", "--app-dir", "/acceptance", "--host", "0.0.0.0", "--port", "9080"]
    volumes:
      - ../../tests/integration/fixtures/pvc_transition_upstream.py:/acceptance/pvc_transition_upstream.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9080/health')"]
      interval: 1s
      timeout: 2s
      retries: 20

volumes:
  pvc-channels:
  pvc-engine-ipc:
  pvc-transfer:
