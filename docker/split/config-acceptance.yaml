schemaVersion: "1"
agent:
  name: split-acceptance
model:
  name: test-model
  type: openai
capability:
  type: ach
  ach:
    baseUrl: http://mock-upstream:9080
    environment: platform
prompt:
  system:
    type: text
    text: "You are an acceptance fixture agent."
persistence:
  enabled: true
  mountPath: /var/lib/ach-agent
engine:
  forwardEnv: [DEBUG, CUSTOM_TOOL_TOKEN]
  home: /var/lib/ach-agent/home
  workDir: /var/lib/ach-agent/workspace
  startupTimeoutSeconds: 30
  idleTtlSeconds: 30
limits:
  maxConcurrentInvocations: 2
  maxInvocationSeconds: 20
  maxQueuedTotal: 16
  maxSteps: 8
  terminalOutputRetries: 1
cost:
  source: none
channels:
  - name: acceptance
    type: webhook
    source: generic
    concurrency: 2
    prompt: "Answer the split acceptance probe."
    session:
      type: custom
      key: "split-acceptance-conversation"
    webhook:
      auth:
        type: none
    prepare:
      script: >-
        test "$PWD" = "$ACH_WORKSPACE" && test "$HOME" = "$ACH_WORKSPACE" &&
        test "$TOKEN" = synthetic &&
        { test -f retained || printf original > retained; } &&
        printf x >> .split-prepare-runs
      timeoutSeconds: 5
      secretEnv:
        TOKEN:
          env: SPLIT_PREPARE_TOKEN
    cleanup:
      script: >-
        test "$HOME" = "$ACH_WORKSPACE" &&
        printf x >> "$ACH_WORKSPACE/.split-cleanup-runs"
      timeoutSeconds: 5
  - name: cancel
    type: webhook
    source: generic
    concurrency: 1
    prompt: "CANCEL_ME"
    session:
      type: custom
      key: "split-cancel-conversation"
    webhook:
      auth:
        type: none
