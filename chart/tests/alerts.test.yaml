rule_files:
  - ../alerts/ach-agent.rules.yaml

evaluation_interval: 30s
tests:
  - name: missing series does not fire
    interval: 30s
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHPersistenceFailed
        exp_alerts: []
      - eval_time: 30s
        alertname: ACHRestoreFailed
        exp_alerts: []
      - eval_time: 30s
        alertname: ACHStartOutcomeUnknown
        exp_alerts: []
      - eval_time: 30s
        alertname: ACHRepeatedPodFailures
        exp_alerts: []

  - name: initialized zero counters do not fire
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="persistence_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x12'
      - series: 'ach_agent_anomalies_total{kind="restore_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x12'
      - series: 'ach_agent_anomalies_total{kind="start_outcome_unknown", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x12'
      - series: 'ach_agent_anomalies_total{kind="pod_unhealthy", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHPersistenceFailed
        exp_alerts: []
      - eval_time: 30s
        alertname: ACHRestoreFailed
        exp_alerts: []
      - eval_time: 30s
        alertname: ACHStartOutcomeUnknown
        exp_alerts: []
      - eval_time: 30s
        alertname: ACHRepeatedPodFailures
        exp_alerts: []

  - name: first observed persistence and restore counters fire
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="persistence_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '1+0x1'
      - series: 'ach_agent_anomalies_total{kind="restore_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '1+0x1'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHPersistenceFailed
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH persistence failed for agent alpha
              description: Persistence failed for agent alpha in namespace ns and environment prod.
      - eval_time: 30s
        alertname: ACHRestoreFailed
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH restore failed for agent alpha
              description: Restore failed for agent alpha in namespace ns and environment prod.

  - name: both unknown kinds select the same alert
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="start_outcome_unknown", namespace="ns", agent="alpha", environment="prod"}'
        values: '1+0x1'
      - series: 'ach_agent_anomalies_total{kind="run_outcome_unknown", namespace="ns", agent="beta", environment="staging"}'
        values: '1+0x1'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHStartOutcomeUnknown
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH run outcome is unknown for agent alpha
              description: An ACH start or run outcome is unknown for agent alpha in namespace ns and environment prod. Investigate the run state before retrying; do not blindly replay it.
          - exp_labels:
              namespace: ns
              agent: beta
              environment: staging
              severity: warning
            exp_annotations:
              summary: ACH run outcome is unknown for agent beta
              description: An ACH start or run outcome is unknown for agent beta in namespace ns and environment staging. Investigate the run state before retrying; do not blindly replay it.

  - name: zero to one counter increment fires
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="persistence_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x10 1+0x2'
    alert_rule_test:
      - eval_time: 5m30s
        alertname: ACHPersistenceFailed
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH persistence failed for agent alpha
              description: Persistence failed for agent alpha in namespace ns and environment prod.

  - name: increment after counter reset fires
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="persistence_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '5+0x10 1 2'
    alert_rule_test:
      - eval_time: 6m
        alertname: ACHPersistenceFailed
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH persistence failed for agent alpha
              description: Persistence failed for agent alpha in namespace ns and environment prod.

  - name: one pod failure does not satisfy repeated threshold
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="pod_unhealthy", namespace="ns", agent="alpha", environment="prod"}'
        values: '1+0x21'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHRepeatedPodFailures
        exp_alerts: []
      - eval_time: 5m
        alertname: ACHRepeatedPodFailures
        exp_alerts: []
      - eval_time: 9m30s
        alertname: ACHRepeatedPodFailures
        exp_alerts: []

  - name: established and newly appearing series contribute to one agent threshold
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="pod_unhealthy", namespace="ns", agent="alpha", environment="prod", instance="old"}'
        values: '0+0x20 1+0x3'
      - series: 'ach_agent_anomalies_total{kind="pod_unhealthy", namespace="ns", agent="alpha", environment="prod", instance="new"}'
        values: '_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1+0x3'
    alert_rule_test:
      - eval_time: 10m30s
        alertname: ACHRepeatedPodFailures
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH pod failures repeated for agent alpha
              description: At least two unhealthy pod events were observed for agent alpha in namespace ns and environment prod within 10m.
      - eval_time: 11m
        alertname: ACHRepeatedPodFailures
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH pod failures repeated for agent alpha
              description: At least two unhealthy pod events were observed for agent alpha in namespace ns and environment prod within 10m.

  - name: initial pod counter increment to two stays firing within the window
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="pod_unhealthy", namespace="ns", agent="alpha", environment="prod"}'
        values: '1 2+0x22'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHRepeatedPodFailures
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH pod failures repeated for agent alpha
              description: At least two unhealthy pod events were observed for agent alpha in namespace ns and environment prod within 10m.
      - eval_time: 5m
        alertname: ACHRepeatedPodFailures
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH pod failures repeated for agent alpha
              description: At least two unhealthy pod events were observed for agent alpha in namespace ns and environment prod within 10m.
      - eval_time: 9m30s
        alertname: ACHRepeatedPodFailures
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH pod failures repeated for agent alpha
              description: At least two unhealthy pod events were observed for agent alpha in namespace ns and environment prod within 10m.
      - eval_time: 10m
        alertname: ACHRepeatedPodFailures
        exp_alerts: []

  - name: pod failure counter reset then second event still fires
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="pod_unhealthy", namespace="ns", agent="alpha", environment="prod"}'
        values: '5+0x10 1 2+0x9'
    alert_rule_test:
      - eval_time: 10m
        alertname: ACHRepeatedPodFailures
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH pod failures repeated for agent alpha
              description: At least two unhealthy pod events were observed for agent alpha in namespace ns and environment prod within 10m.

  - name: old anomaly resolves after its event window
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="persistence_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '0 1+0x12'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHPersistenceFailed
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH persistence failed for agent alpha
              description: Persistence failed for agent alpha in namespace ns and environment prod.
      - eval_time: 6m
        alertname: ACHPersistenceFailed
        exp_alerts: []

  - name: separate agents retain separate alert labels
    interval: 30s
    input_series:
      - series: 'ach_agent_anomalies_total{kind="restore_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '1+0x1'
      - series: 'ach_agent_anomalies_total{kind="restore_failed", namespace="other", agent="beta", environment="staging"}'
        values: '1+0x1'
    alert_rule_test:
      - eval_time: 30s
        alertname: ACHRestoreFailed
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              environment: prod
              severity: warning
            exp_annotations:
              summary: ACH restore failed for agent alpha
              description: Restore failed for agent alpha in namespace ns and environment prod.
          - exp_labels:
              namespace: other
              agent: beta
              environment: staging
              severity: warning
            exp_annotations:
              summary: ACH restore failed for agent beta
              description: Restore failed for agent beta in namespace other and environment staging.
  - name: exchanged credential healthy, failing, expired, static
    interval: 30s
    input_series:
      # Refreshed at 80% of a 900 s lifetime: expiry jumps by 720 s every 720 s.
      - series: 'ach_agent_key_expiry_timestamp_seconds{namespace="ns", agent="ok", environment="prod"}'
        values: '900x23 1620x23 2340x23'
      - series: 'ach_agent_key_lifetime_seconds{namespace="ns", agent="ok", environment="prod"}'
        values: '900x71'
      # Never refreshed after boot.
      - series: 'ach_agent_key_expiry_timestamp_seconds{namespace="ns", agent="stuck", environment="prod"}'
        values: '900x71'
      - series: 'ach_agent_key_lifetime_seconds{namespace="ns", agent="stuck", environment="prod"}'
        values: '900x71'
      # A static ek_ agent exports both gauges at 0.
      - series: 'ach_agent_key_expiry_timestamp_seconds{namespace="ns", agent="static", environment="prod"}'
        values: '0x71'
      - series: 'ach_agent_key_lifetime_seconds{namespace="ns", agent="static", environment="prod"}'
        values: '0x71'
    alert_rule_test:
      - eval_time: 13m
        alertname: ACHAgentKeyRefreshFailing
        exp_alerts: []
      - eval_time: 14m
        alertname: ACHAgentKeyRefreshFailing
        exp_alerts:
          - exp_labels: {namespace: ns, agent: stuck, environment: prod, severity: warning}
            exp_annotations:
              summary: ACH agent stuck cannot refresh its ACH credential
              description: Agent stuck in namespace ns has 60s left on its exchanged ACH credential (negative means expired and the agent is not ready). See ach_agent_key_refresh_failures_total and the control pod log for ACH's error code.
      - eval_time: 20m
        alertname: ACHAgentKeyRefreshFailing
        exp_alerts:
          - exp_labels: {namespace: ns, agent: stuck, environment: prod, severity: warning}
            exp_annotations:
              summary: ACH agent stuck cannot refresh its ACH credential
              description: Agent stuck in namespace ns has -300s left on its exchanged ACH credential (negative means expired and the agent is not ready). See ach_agent_key_refresh_failures_total and the control pod log for ACH's error code.

  - name: storage server down fires after five minutes without a ready replica
    interval: 30s
    input_series:
      - series: 'kube_statefulset_status_replicas_ready{namespace="ach-agent", statefulset="ach-agent-storage"}'
        values: '0x20'
      - series: 'kube_statefulset_status_replicas_ready{namespace="team-b", statefulset="ach-agent-storage"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: ACHAgentStorageDown
        exp_alerts: []
      - eval_time: 6m
        alertname: ACHAgentStorageDown
        exp_alerts:
          - exp_labels:
              namespace: ach-agent
              severity: critical
            exp_annotations:
              summary: ACH agent storage server is down in namespace ach-agent
              description: The storage server ach-agent-storage in namespace ach-agent has had no ready pod for 5 minutes. Workspace and session saves and restores in that namespace fail until it is back.

  - name: storage disk high fires when usage stays above 85 percent
    interval: 30s
    input_series:
      - series: 'SeaweedFS_volumeServer_resource{namespace="ach-agent", pod="ach-agent-storage-0", name="/data", type="used"}'
        values: '90x40'
      - series: 'SeaweedFS_volumeServer_resource{namespace="ach-agent", pod="ach-agent-storage-0", name="/data", type="all"}'
        values: '100x40'
      - series: 'SeaweedFS_volumeServer_resource{namespace="team-b", pod="ach-agent-storage-0", name="/data", type="used"}'
        values: '50x40'
      - series: 'SeaweedFS_volumeServer_resource{namespace="team-b", pod="ach-agent-storage-0", name="/data", type="all"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: ACHAgentStorageDiskHigh
        exp_alerts: []
      - eval_time: 16m
        alertname: ACHAgentStorageDiskHigh
        exp_alerts:
          - exp_labels:
              namespace: ach-agent
              pod: ach-agent-storage-0
              severity: warning
            exp_annotations:
              summary: ACH agent storage volume is 90% full in namespace ach-agent
              description: The storage server in namespace ach-agent cannot evict below storage.evictThreshold, so most of its volume holds data S3 does not have yet. Check S3 reachability and the sync container; grow the volume if the backlog is legitimate.

  - name: storage sync lag fires on old unsynced files or a stale reconcile
    interval: 30s
    input_series:
      - series: 'ach_agent_storage_unsynced_files{namespace="ach-agent", pod="ach-agent-storage-0"}'
        values: '3x100'
      - series: 'ach_agent_storage_reconcile_ok_timestamp_seconds{namespace="ach-agent", pod="ach-agent-storage-0"}'
        values: '0+30x100'
      - series: 'ach_agent_storage_unsynced_files{namespace="team-b", pod="ach-agent-storage-0"}'
        values: '0x100'
      - series: 'ach_agent_storage_reconcile_ok_timestamp_seconds{namespace="team-b", pod="ach-agent-storage-0"}'
        values: '0x100'
      - series: 'ach_agent_storage_unsynced_files{namespace="team-c", pod="ach-agent-storage-0"}'
        values: '0x100'
      - series: 'ach_agent_storage_reconcile_ok_timestamp_seconds{namespace="team-c", pod="ach-agent-storage-0"}'
        values: '0+30x100'
    alert_rule_test:
      - eval_time: 14m
        alertname: ACHAgentStorageSyncLagging
        exp_alerts: []
      - eval_time: 16m
        alertname: ACHAgentStorageSyncLagging
        exp_alerts:
          - exp_labels:
              namespace: ach-agent
              severity: warning
            exp_annotations:
              summary: ACH agent storage in namespace ach-agent is not keeping S3 up to date
              description: The storage server in namespace ach-agent holds files S3 does not have, or has not been able to compare with S3, for over 15 minutes. Saves still succeed, but losing its volume would lose them. Check S3 reachability, the bucket credentials and the sync and reconcile containers. With S3 reachable, restarting the storage pod uploads what is missing before it takes traffic again.
      - eval_time: 46m
        alertname: ACHAgentStorageSyncLagging
        exp_alerts:
          - exp_labels:
              namespace: ach-agent
              severity: warning
            exp_annotations:
              summary: ACH agent storage in namespace ach-agent is not keeping S3 up to date
              description: The storage server in namespace ach-agent holds files S3 does not have, or has not been able to compare with S3, for over 15 minutes. Saves still succeed, but losing its volume would lose them. Check S3 reachability, the bucket credentials and the sync and reconcile containers. With S3 reachable, restarting the storage pod uploads what is missing before it takes traffic again.
          - exp_labels:
              namespace: team-b
              severity: warning
            exp_annotations:
              summary: ACH agent storage in namespace team-b is not keeping S3 up to date
              description: The storage server in namespace team-b holds files S3 does not have, or has not been able to compare with S3, for over 15 minutes. Saves still succeed, but losing its volume would lose them. Check S3 reachability, the bucket credentials and the sync and reconcile containers. With S3 reachable, restarting the storage pod uploads what is missing before it takes traffic again.

  - name: failed runs with none completed fire
    interval: 1m
    input_series:
      - series: 'ach_agent_runs_total{channel="chat", outcome="failed", namespace="ns", agent="alpha"}'
        values: '0+0x5 1 2 3 4+0x60'
      - series: 'ach_agent_runs_total{channel="chat", outcome="completed", namespace="ns", agent="alpha"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 5m
        alertname: ACHAgentRunsFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: ACHAgentRunsFailing
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              severity: warning
            exp_annotations:
              summary: ACH agent alpha keeps failing its runs
              description: "4 runs of agent alpha in namespace ns failed in the last hour and none completed. The gateway's failed requests for the agent's key usually say why: budget, auth, or a model provider or MCP server down."

  - name: a completed run keeps failed runs from firing
    interval: 1m
    input_series:
      - series: 'ach_agent_runs_total{channel="chat", outcome="failed", namespace="ns", agent="alpha"}'
        values: '0+0x5 1 2 3 4+0x60'
      - series: 'ach_agent_runs_total{channel="chat", outcome="completed", namespace="ns", agent="alpha"}'
        values: '0+0x7 1+0x60'
    alert_rule_test:
      - eval_time: 15m
        alertname: ACHAgentRunsFailing
        exp_alerts: []

  - name: start failures fire even when runs fail too
    interval: 1m
    input_series:
      - series: 'ach_agent_anomalies_total{kind="start_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x5 1 2 3 4+0x60'
      - series: 'ach_agent_runs_total{channel="chat", outcome="failed", namespace="ns", agent="alpha"}'
        values: '0+0x5 1+0x60'
      - series: 'ach_agent_runs_total{channel="chat", outcome="completed", namespace="ns", agent="alpha"}'
        values: '0+0x70'
    alert_rule_test:
      - eval_time: 15m
        alertname: ACHAgentStartFailing
        exp_alerts:
          - exp_labels:
              namespace: ns
              agent: alpha
              severity: warning
            exp_annotations:
              summary: ACH agent alpha keeps failing to start
              description: 4 invocations of agent alpha in namespace ns failed to start in the last hour and none completed. Check the agent pod logs for the start_failed cause.

  - name: a completed run keeps start failures from firing
    interval: 1m
    input_series:
      - series: 'ach_agent_anomalies_total{kind="start_failed", namespace="ns", agent="alpha", environment="prod"}'
        values: '0+0x5 1 2 3 4+0x60'
      - series: 'ach_agent_runs_total{channel="chat", outcome="completed", namespace="ns", agent="alpha"}'
        values: '0+0x7 1+0x60'
    alert_rule_test:
      - eval_time: 15m
        alertname: ACHAgentStartFailing
        exp_alerts: []
