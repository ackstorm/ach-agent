name: ach-agent-split

services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: default
    command: ["--role", "harness"]
    environment:
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      DEBUG: ${DEBUG:-}
      CUSTOM_TOOL_TOKEN: ${CUSTOM_TOOL_TOKEN:-}
      SPLIT_PREPARE_TOKEN: ${SPLIT_PREPARE_TOKEN:-}
    ports:
      - "8080:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - ./${ACH_HARNESS_CONFIG_FILE:-config.yaml}:/etc/ach-agent/config.yaml:ro
      - harness-state:/var/lib/ach-agent/state
      - shared-workspace:/var/lib/ach-agent/home/workspace
      - channels-ipc:/run/ach-agent/channels
      - engine-ipc:/run/ach-agent/engine:ro
      - transfer-ipc:/run/ach-agent/transfer

  channels:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: default
    command: ["--role", "channels"]
    depends_on:
      - harness
    network_mode: service:harness
    environment:
      ACH_TOKEN: ${ACH_TOKEN:?set ACH_TOKEN}
      ACH_BASE_URL: ${ACH_BASE_URL:?set ACH_BASE_URL}
      ACH_ENVIRONMENT: ${ACH_ENVIRONMENT:-platform}
      DEBUG: ${DEBUG:-}
      CUSTOM_TOOL_TOKEN: ${CUSTOM_TOOL_TOKEN:-}
      SPLIT_PREPARE_TOKEN: ${SPLIT_PREPARE_TOKEN:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - channels-ipc:/run/ach-agent/channels:ro

  engine:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: default
    command: ["--role", "engine"]
    network_mode: service:harness
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s
    volumes:
      - engine-ipc:/run/ach-agent/engine
      - engine-home:/var/lib/ach-agent/home
      - shared-workspace:/var/lib/ach-agent/home/workspace
      - transfer-ipc:/run/ach-agent/transfer

volumes:
  harness-state:
  engine-home:
  shared-workspace:
  channels-ipc:
  engine-ipc:
  transfer-ipc:
