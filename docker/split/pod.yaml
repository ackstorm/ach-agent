apiVersion: v1
kind: Pod
metadata:
  name: ach-agent-split
  labels:
    app.kubernetes.io/name: ach-agent
    app.kubernetes.io/component: split
spec:
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  shareProcessNamespace: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: harness-config
      configMap:
        name: ach-agent-config
    - name: channels-ipc
      emptyDir: {}
    - name: engine-ipc
      emptyDir: {}
    - name: state
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: workspace
      persistentVolumeClaim:
        claimName: ach-agent-state
    - name: transfer-ipc
      emptyDir: {}
    - name: harness-tmp
      emptyDir: {}
    - name: channels-tmp
      emptyDir: {}
    - name: engine-tmp
      emptyDir: {}
  containers:
    - name: harness
      image: ghcr.io/ackstorm/ach-agent:latest
      imagePullPolicy: IfNotPresent
      args: ["--role", "harness"]
      ports:
        - name: harness-health
          containerPort: 8090
      env:
        - name: ACH_BASE_URL
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-base-url
        - name: ACH_TOKEN
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-token
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8090
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /readyz
          port: 8090
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8090
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      securityContext: &restricted
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: harness-config
          mountPath: /etc/ach-agent/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: state
          mountPath: /var/lib/ach-agent/state
          subPath: state
        - name: workspace
          mountPath: /var/lib/ach-agent/workspace
          subPath: workspace
        - name: transfer-ipc
          mountPath: /run/ach-agent/transfer
        - name: harness-tmp
          mountPath: /tmp
        - name: channels-ipc
          mountPath: /run/ach-agent/channels
        - name: engine-ipc
          mountPath: /run/ach-agent/engine
          readOnly: true
    - name: channels
      image: ghcr.io/ackstorm/ach-agent:latest
      imagePullPolicy: IfNotPresent
      args: ["--role", "channels"]
      env:
        - name: ACH_BASE_URL
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-base-url
        - name: ACH_TOKEN
          valueFrom:
            secretKeyRef:
              name: ach-agent-secrets
              key: ach-token
      ports:
        - name: ingress
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /readyz
          port: 8080
        periodSeconds: 5
        initialDelaySeconds: 15
        timeoutSeconds: 3
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      securityContext: *restricted
      volumeMounts:
        - name: channels-ipc
          mountPath: /run/ach-agent/channels
          readOnly: true
        - name: channels-tmp
          mountPath: /tmp
    - name: engine
      image: ghcr.io/ackstorm/ach-agent:latest
      imagePullPolicy: IfNotPresent
      args: ["--role", "engine"]
      ports:
        - name: engine-health
          containerPort: 8081
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8081
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /readyz
          port: 8081
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8081
        periodSeconds: 20
        timeoutSeconds: 3
        failureThreshold: 3
      securityContext: *restricted
      volumeMounts:
        - name: engine-ipc
          mountPath: /run/ach-agent/engine
        - name: state
          mountPath: /var/lib/ach-agent/home
          subPath: home
        - name: workspace
          mountPath: /var/lib/ach-agent/workspace
          subPath: workspace
        - name: transfer-ipc
          mountPath: /run/ach-agent/transfer
        - name: engine-tmp
          mountPath: /tmp
